name: pre-commit

on:
  pull_request:
  push:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: sudo apt-get update && sudo apt-get -y install cppcheck

      - uses: pre-commit/action@v2.0.3
        with:
          extra_args: --all-files
